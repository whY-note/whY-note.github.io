<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c9c0ad">
  <meta name="description" content="Haowen Yan's life room — reflections, notes and memories in a 3D room following Shunde's sunrise and sunset.">
  <title>Life Room | Haowen Yan</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="preload" href="./models/room.glb" as="fetch" type="model/gltf-binary" crossorigin>
  <script type="importmap">
    {"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/"}}
  </script>
</head>
<body>
  <main id="scene-wrap" class="room-stage" aria-labelledby="room-heading" aria-busy="true">
    <h1 id="room-heading" class="sr-only">Haowen 的生活房间</h1>
    <img id="room-poster" class="room-poster" src="./models/room-preview.webp" alt="阳光照进左侧窗户，窗下是书桌；后墙依次挂着照片、地图和书法，右侧高低柜上摆着书本、相册和唱片机" width="1500" height="1000">
    <canvas id="room-canvas" aria-label="可交互的三维房间" aria-describedby="room-help" tabindex="0"></canvas>
    <p id="room-help" class="sr-only">桌面拖动可小幅环视，手机竖屏左右拖动查看房间，滚轮或双指缩放。点击物品打开内容。聚焦画布后，方向键调整视野，加减键缩放，Home 恢复视角。</p>
    <div id="loading-status" class="loading-status" role="status" aria-live="polite"><span class="loading-dot" aria-hidden="true"></span><span id="loading-text">正在打开房间…</span></div>
  </main>

  <a class="back-link glass" href="/">返回主页</a>
  <div class="scene-toolbar" role="group" aria-label="房间视角控制" hidden>
    <p class="gesture-hint">小幅拖动环视 · 滚轮缩放 · 点击物品</p>
    <div class="toolbar-buttons glass">
      <button id="pan-left" class="pan-button" type="button" aria-label="查看房间左侧" hidden>左侧</button>
      <button id="zoom-out" class="icon-button" type="button" aria-label="缩小房间" title="缩小">−</button>
      <button id="zoom-in" class="icon-button" type="button" aria-label="放大房间" title="放大">＋</button>
      <button id="reset-view" class="reset-button" type="button">恢复视角</button>
      <button id="pan-right" class="pan-button" type="button" aria-label="查看房间右侧" hidden>右侧</button>
    </div>
  </div>
  <div id="link-toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript-message glass">三维交互需要 JavaScript，请启用后刷新页面。</p></noscript>
  <script src="./script.js" defer></script>
</body>
</html>
